name: blend
services:
  app:
    image: ${BLEND_IMAGE:-blend-app}
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      FRONTEND_URL: https://blend.tanmaytiwari.me
      DEPLOYED_DOMAIN: https://blend.tanmaytiwari.me/api
      ENABLE_DEBUG: "false"
      ENABLE_FALLBACK: "false"
    ports:
      - "127.0.0.1:5060:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
